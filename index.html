<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美国州税检索表</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
        .custom-scrollbar:hover::-webkit-scrollbar-thumb { background-color: #94a3b8; }
        
        .animate-fade-in { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="text-slate-800 antialiased h-screen flex flex-col overflow-hidden bg-slate-50">

    <header class="bg-slate-900 text-white shadow-lg z-20 relative">
        <div class="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <!-- 移动端菜单按钮 -->
                <button id="mobileMenuBtn" class="md:hidden text-slate-300 hover:text-white focus:outline-none transition-colors">
                    <i class="fa-solid fa-bars text-2xl"></i>
                </button>
                <div class="bg-indigo-500/20 p-2 rounded-lg hidden sm:block">
                    <i class="fa-solid fa-building-columns text-2xl text-indigo-400"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">美国州税检索表</h1>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <!-- 申报日历按钮 -->
                <button id="openCalendarBtn" class="text-sm bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg font-medium transition-colors flex items-center shadow-sm">
                    <i class="fa-regular fa-calendar-days md:mr-2"></i> <span class="hidden md:inline">全美申报日历</span>
                </button>
                <div class="hidden lg:flex text-sm bg-slate-800/80 px-4 py-2 rounded-lg border border-slate-700 items-center text-slate-300">
                    <i class="fa-solid fa-shield-halved mr-2 text-emerald-400"></i>
                    <span><strong class="text-white">PL 86-272 保护：</strong>仅限于有形动产推销，受联邦法豁免企业所得税。</span>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-[1400px] w-full mx-auto md:px-6 lg:px-8 md:py-6 flex flex-col md:flex-row gap-6 overflow-hidden relative">
        
        <div id="sidebarOverlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-30 hidden transition-opacity md:hidden"></div>

        <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-[280px] sm:w-[320px] md:relative md:w-[320px] lg:w-[360px] transform -translate-x-full md:translate-x-0 transition duration-300 ease-in-out flex-shrink-0 flex flex-col h-full bg-white md:rounded-2xl shadow-2xl md:shadow-sm border-r md:border border-slate-200 overflow-hidden">
            <div class="p-5 border-b border-slate-100 bg-slate-50/50">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-base font-semibold text-slate-700 flex items-center">
                        <i class="fa-solid fa-location-dot text-indigo-500 mr-2"></i> 选择目标州
                    </h2>
                    <!-- 移动端关闭按钮 -->
                    <button id="closeSidebarBtn" class="md:hidden text-slate-400 hover:text-slate-600 focus:outline-none p-1">
                        <i class="fa-solid fa-xmark text-xl"></i>
                    </button>
                </div>
                <div class="relative">
                    <i class="fa-solid fa-search absolute left-3.5 top-3 text-slate-400"></i>
                    <input type="text" id="searchInput" placeholder="搜索州名或缩写 (如 WA, 纽约)..." class="w-full bg-white border border-slate-200 text-slate-800 text-sm rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 block pl-10 p-2.5 transition-shadow shadow-sm">
                </div>
            </div>
            <div class="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-1" id="stateList">
                <!-- State list populated by JS -->
            </div>
        </aside>

        <section class="flex-1 h-full bg-white md:rounded-2xl shadow-sm md:border border-slate-200 overflow-hidden flex flex-col w-full relative z-10">
            
            <!-- Welcome Screen -->
            <div id="welcomeScreen" class="flex-1 flex flex-col items-center justify-center p-8 text-center h-full">
                <div class="w-24 h-24 bg-indigo-50 rounded-full flex items-center justify-center mb-6 shadow-inner">
                    <i class="fa-solid fa-map-location-dot text-4xl text-indigo-300"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-700 mb-3">请选择目标州</h2>
                <p class="text-slate-500 max-w-md leading-relaxed">
                    在左侧选择您产生业务的州，以查看针对 C-Corp 批发企业的详细税务合规要求。<br><br>
                    <span class="text-sm bg-slate-100 px-3 py-1 rounded-full text-slate-600 inline-block mt-2"><i class="fa-solid fa-lightbulb text-amber-500 mr-1"></i> 提示：优先关注有库存税、总收入税的州。</span>
                </p>
            </div>

            <div id="taxDisplayScreen" class="hidden flex-col h-full p-6 lg:p-8">
                <!-- State Header Info -->
                <div class="border-b border-slate-100 pb-5 mb-2">
                    <div class="flex items-center space-x-4 mb-3">
                        <div class="w-12 h-12 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold text-xl shadow-md" id="stateAbbr"></div>
                        <div>
                            <h2 class="text-2xl font-bold text-slate-800" id="stateTitle"></h2>
                            <p class="text-slate-500 text-sm mt-0.5" id="stateEnTitle"></p>
                        </div>
                    </div>
                    <div id="tagContainer" class="flex flex-wrap gap-2 mt-3"></div>
                    <p class="text-slate-600 text-sm mt-4 bg-slate-50 p-4 rounded-xl border border-slate-100 leading-relaxed" id="stateNote"></p>
                </div>

                <!-- Scrollable Cards Container -->
                <div class="flex-1 overflow-y-auto custom-scrollbar mt-2 pr-1 space-y-6 pb-6" id="taxCardsContainer">
                    <!-- Cards will be injected here -->
                </div>
            </div>

        </section>
    </main>

    <div id="calendarModal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm modal-overlay"></div>
        <div class="absolute inset-x-0 bottom-0 md:inset-auto md:top-1/2 md:left-1/2 md:-translate-x-1/2 md:-translate-y-1/2 bg-white w-full md:w-[850px] max-h-[90vh] md:h-[600px] rounded-t-3xl md:rounded-2xl shadow-2xl flex flex-col overflow-hidden transition-all">
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50 flex-shrink-0">
                <h2 class="text-xl font-bold text-slate-800 flex items-center">
                    <div class="w-8 h-8 rounded bg-indigo-100 text-indigo-600 flex items-center justify-center mr-3 shadow-sm">
                        <i class="fa-regular fa-calendar-check"></i>
                    </div>
                    全美 C-Corp 税务申报日历
                </h2>
                <button id="closeCalendarBtn" class="text-slate-400 hover:text-rose-500 transition-colors p-2 focus:outline-none">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            
            <div class="flex flex-col md:flex-row flex-1 overflow-hidden">
                <!-- 左侧：日历控件 -->
                <div class="w-full md:w-[55%] flex flex-col border-b md:border-b-0 md:border-r border-slate-100 p-5 bg-white overflow-y-auto">
                    <div class="flex justify-between items-center mb-6">
                        <button id="prevMonthBtn" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-600 transition-colors focus:outline-none">
                            <i class="fa-solid fa-chevron-left"></i>
                        </button>
                        <h3 id="currentMonthYear" class="text-lg font-bold text-slate-800"></h3>
                        <button id="nextMonthBtn" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-600 transition-colors focus:outline-none">
                            <i class="fa-solid fa-chevron-right"></i>
                        </button>
                    </div>
                    
                    <div class="grid grid-cols-7 gap-1 text-center mb-2">
                        <div class="text-xs font-semibold text-rose-500">日</div>
                        <div class="text-xs font-semibold text-slate-500">一</div>
                        <div class="text-xs font-semibold text-slate-500">二</div>
                        <div class="text-xs font-semibold text-slate-500">三</div>
                        <div class="text-xs font-semibold text-slate-500">四</div>
                        <div class="text-xs font-semibold text-slate-500">五</div>
                        <div class="text-xs font-semibold text-slate-500">六</div>
                    </div>
                    
                    <div id="calendarGrid" class="grid grid-cols-7 gap-1 text-center">
                        <!-- JS 注入日期 -->
                    </div>
                </div>
                
                <!-- 右侧：详情展示 -->
                <div class="w-full md:w-[45%] bg-slate-50/80 p-5 flex flex-col h-full overflow-y-auto custom-scrollbar">
                    <div class="flex items-center justify-between mb-4 pb-2 border-b border-slate-200">
                        <h4 id="selectedDateHeader" class="font-bold text-slate-700 text-lg">本月关键节点</h4>
                        <button id="resetMonthViewBtn" class="text-xs text-indigo-600 hover:text-indigo-800 hidden font-medium bg-indigo-50 px-2 py-1 rounded">查看全月</button>
                    </div>
                    <div id="dateDetailsContainer" class="space-y-4 flex-1">
                        <!-- JS 注入详情 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Formatter utilities
        const formula = (text) => `<div class="bg-indigo-50/50 p-3 rounded-lg border border-indigo-100 my-2 font-mono text-sm text-indigo-800"><i class="fa-solid fa-calculator text-indigo-400 mr-2"></i>${text}</div>`;
        
        // Data generation helpers
        const cit = (rate, threshold, calcFormula, pl86272 = true, extraNote = "") => ({
            type: "企业所得税 (Corporate Income Tax / CIT)",
            nexus: `<b>经济关联门槛 (Economic Nexus)：</b>年度本州总销售额达到或超过 <b>${threshold}</b>。` + 
                   (pl86272 ? `<br><span class='text-emerald-700 text-xs mt-1.5 block font-medium'><i class="fa-solid fa-shield-halved"></i> 联邦法保护：纯跨州有形货物批发，受联邦 PL 86-272 保护，可免缴此类基于净利润的所得税。</span>` : ""),
            rate: rate,
            calc: formula(calcFormula) + extraNote,
            deadline: "通常为公司财年结束后第 4 个月的 15 日前 (如 4月15日)。",
            penalty: "晚交及晚申报通常各按每月 5% 累计，上限最高可达未缴税款的 25%。"
        });

        const getGenericSalesTax = (stateName, salesThreshold, certName = "多州通用转售证明 (MTC)", certLink = "https://www.mtc.gov/wp-content/uploads/2023/01/Unif-Resale-Cert-revised-10-14-22.pdf") => ({
            type: "销售及使用税 (Sales & Use Tax)",
            nexus: `<b>关联门槛 (Sales Tax Nexus)：</b>年度本州总销售额达到或超过 <b>${salesThreshold}</b>。<br><span class='text-amber-600 text-xs mt-1.5 block font-medium'><i class="fa-solid fa-circle-info"></i> 注意：B2B 免税批发金额同样计入门槛，达标即触发注册义务。</span>`,
            rate: "州级基础税率 + 地方附加税",
            calc: formula("应纳税额 = 州内应税销售总额 × 综合税率") + `<span class='font-semibold text-indigo-600 block mb-1 mt-2'>实务操作：</span>必须注册税号，交易时向客户索要 <b>${certName}</b>，按期提交<b>零申报 (Zero Return)</b>。`,
            deadline: "依州税务局指派频率 (季报/年报)。",
            penalty: "未零申报面临 $50-$100 晚申报罚金。",
            cert: { name: certName, link: certLink }
        });

        const inventoryTax = (rate, calcText, note) => ({
            type: "商业库存税 / 财产税 (Business Personal Property Tax)",
            nexus: "<b>关联门槛：</b>在本州拥有实物库存（如海外仓、3PL、FBA仓、自有仓库）。<br><span class='text-purple-700 text-xs mt-1.5 block font-medium'><i class='fa-solid fa-triangle-exclamation'></i> 财产税性质，完全不受 PL 86-272 保护！</span>",
            rate: rate,
            calc: formula(calcText) + note,
            deadline: "多为每年 1月1日 评估价值，3月至4月 提交申报 (Rendition)。",
            penalty: "未申报或低报通常面临 10% 评估价值罚金。"
        });

        const nomadSalesTax = () => ({
            type: "销售及使用税 (Sales Tax)",
            nexus: "无。本州不征收州级销售税。", rate: "0%", calc: "无需注册销售税号，也无需收集免税证明。", deadline: "-", penalty: "-"
        });

        const stateNamesMap = {
            "AL": ["阿拉巴马", "Alabama"], "AK": ["阿拉斯加", "Alaska"], "AZ": ["亚利桑那", "Arizona"],
            "AR": ["阿肯色", "Arkansas"], "CA": ["加利福尼亚", "California"], "CO": ["科罗拉多", "Colorado"],
            "CT": ["康涅狄格", "Connecticut"], "DE": ["特拉华", "Delaware"], "FL": ["佛罗里达", "Florida"],
            "GA": ["佐治亚", "Georgia"], "HI": ["夏威夷", "Hawaii"], "ID": ["爱达荷", "Idaho"],
            "IL": ["伊利诺伊", "Illinois"], "IN": ["印第安纳", "Indiana"], "IA": ["爱荷华", "Iowa"],
            "KS": ["堪萨斯", "Kansas"], "KY": ["肯塔基", "Kentucky"], "LA": ["路易斯安那", "Louisiana"],
            "ME": ["缅因", "Maine"], "MD": ["马里兰", "Maryland"], "MA": ["马萨诸塞", "Massachusetts"],
            "MI": ["密歇根", "Michigan"], "MN": ["明尼苏达", "Minnesota"], "MS": ["密西西比", "Mississippi"],
            "MO": ["密苏里", "Missouri"], "MT": ["蒙大拿", "Montana"], "NE": ["内布拉斯加", "Nebraska"],
            "NV": ["内华达", "Nevada"], "NH": ["新罕布什尔", "New Hampshire"], "NJ": ["新泽西", "New Jersey"],
            "NM": ["新墨西哥", "New Mexico"], "NY": ["纽约", "New York"], "NC": ["北卡罗来纳", "North Carolina"],
            "ND": ["北达科他", "North Dakota"], "OH": ["俄亥俄", "Ohio"], "OK": ["俄克拉荷马", "Oklahoma"],
            "OR": ["俄勒冈", "Oregon"], "PA": ["宾夕法尼亚", "Pennsylvania"], "RI": ["罗德岛", "Rhode Island"],
            "SC": ["南卡罗来纳", "South Carolina"], "SD": ["南达科他", "South Dakota"], "TN": ["田纳西", "Tennessee"],
            "TX": ["德克萨斯", "Texas"], "UT": ["犹他", "Utah"], "VT": ["佛蒙特", "Vermont"],
            "VA": ["弗吉尼亚", "Virginia"], "WA": ["华盛顿州(西海岸)", "Washington"], "WV": ["西弗吉尼亚", "West Virginia"],
            "WI": ["威斯康星", "Wisconsin"], "WY": ["怀俄明", "Wyoming"], "DC": ["华盛顿特区(首都)", "Washington D.C."]
        };

        const taxDatabase = {};

        // Generate default setup for all states to ensure 100% coverage
        Object.keys(stateNamesMap).forEach(abbr => {
            taxDatabase[abbr] = {
                name_cn: stateNamesMap[abbr][0],
                name_en: stateNamesMap[abbr][1],
                abbr: abbr,
                note: "标准单/多因子分配州，批发贸易如受 PL 86-272 保护，建议仅作零申报或最低额度申报。",
                tags: ["标准CIT"],
                taxes: [
                    cit("依州而异", "$100,000", "CIT = [联邦应税收入] × 州分摊比 × 州税率"),
                    getGenericSalesTax(stateNamesMap[abbr][0], "$100,000")
                ]
            };
        });

        
        // NOMAD States (No Sales Tax)
        ["AK", "DE", "MT", "NH", "OR"].forEach(abbr => {
            taxDatabase[abbr].taxes[1] = nomadSalesTax();
        });

        // specific overrides
        taxDatabase["WA"] = {
            name_cn: "华盛顿州(西海岸)", name_en: "Washington State", abbr: "WA", 
            note: "【重要：无企业所得税 (No CIT)】。但对总营业额征收 B&O 税，打击利润率，C-Corp极大合规成本。", 
            tags: ["无所得税", "🚨重点: B&O总收入税"], 
            taxes: [
                { type: "商业和职业税 (B&O Tax - 总收入税)", nexus: "<b>经济关联门槛：</b>年度发往本州的销售总额超 <b>$100,000</b>。<br><span class='text-rose-600 text-xs mt-1.5 block font-medium'><i class='fa-solid fa-triangle-exclamation'></i> 警告：总收入税性质，联邦 PL 86-272 豁免完全无效！必须缴纳。</span>", rate: "批发商 (Wholesaler) 税率 <b>0.484%</b>。", calc: formula("应纳税金 = 州内总销售收入 (严禁扣除销货成本) × 0.484%"), deadline: "按月/季/年度申报", penalty: "晚交罚款按 9%、19%、29% 阶梯暴增。" },
                getGenericSalesTax("华盛顿", "$100,000", "华盛顿州转售说明", "https://dor.wa.gov/taxes-rates/retail-sales-tax/reseller-permits")
            ]
        };

        taxDatabase["TX"] = {
            name_cn: "德克萨斯州", name_en: "Texas", abbr: "TX", 
            note: "无所得税。但有特许经营税 (Margin Tax)，且是对商业库存征收重税的州！", 
            tags: ["无所得税", "🚨Margin Tax特许税", "📦重税: 有库存税"], 
            taxes: [
                { type: "特许经营税 / 毛利税 (Franchise Tax)", nexus: "在德州有收入，且全美总收入超 <b>$2.47M</b> (2024年)。<br><span class='text-rose-600 text-xs mt-1.5 block font-medium'>特许经营性质，PL 86-272 豁免无效。</span>", rate: "批发商 <b>0.375%</b>。", calc: formula("应交税 = (全美总收入 - COGS) × (德州收入÷全美收入) × 0.375%") + "不到 2.47M 免税，但<b>强制提交无税申报 (No Tax Due Report)</b>，否则罚款并吊销执照。", deadline: "每年 5月 15日", penalty: "晚报固定罚 $50 加欠款 5%-10%。" },
                inventoryTax("约 1.5%-3.0% (依县而异)", "库存税金 = 1月1日库存评估价值 × 地方税率", "在TX有仓储必须在 4月15日 前提交 Rendition。"),
                getGenericSalesTax("德克萨斯", "$500,000", "德州转售证明 (01-339)", "https://comptroller.texas.gov/forms/01-339.pdf")
            ]
        };

        taxDatabase["GA"] = {
            name_cn: "佐治亚州", name_en: "Georgia", abbr: "GA", 
            note: "作为公司总部所在地，触发所有税制纳税义务。极度依赖 Freeport 豁免。", 
            tags: ["🏢总部", "无豁免保护", "📦有库存税"], 
            taxes: [
                cit("5.75%", "物理存在 (总部)", "CIT = [联邦应税收入] × 5.75%", false, "总部无法使用 PL 86-272。"),
                { type: "净资产税 (Net Worth Tax)", nexus: "在GA注册实体 (总部天然满足)。", rate: "最高$5000", calc: formula("税金 = 查表 (基于净资产)"), deadline: "4月15日", penalty: "晚交10%加利息" },
                inventoryTax("约 1.0%-1.5%", "应纳税金 = (库存评估价值 × 40%) × 地方税率", "<span class='font-bold text-purple-700 block mb-1 mt-2'><i class='fa-solid fa-bell'></i> 亚特兰大总部免税诀窍：</span>若货物主要发往外州，可向县政府申请最高 100% 的 <b>Freeport Exemption</b>。<b>必须在4月1日前递交申请</b>，逾期豁免大打折扣！"),
                getGenericSalesTax("佐治亚", "物理存在", "佐治亚免税表 (ST-5)", "https://dor.georgia.gov/st-5-sales-tax-certificate-exemption")
            ]
        };

        taxDatabase["CA"] = {
            name_cn: "加利福尼亚州", name_en: "California", abbr: "CA", 
            note: "大额销售触发 Nexus，伴随高额罚金与 $800 固定最低税。", 
            tags: ["$71万门槛", "🚨最低税$800"], 
            taxes: [

        // Tailwind class map for dynamic coloring guarantee

        document.addEventListener('DOMContentLoaded', () => {

                sidebar.classList.toggle('-translate-x-full');
                sidebarOverlay.classList.toggle('hidden');

            mobileMenuBtn.addEventListener('click', toggleSidebar);
            closeSidebarBtn.addEventListener('click', toggleSidebar);
            sidebarOverlay.addEventListener('click', toggleSidebar);

            let currentDate = new Date();
            let displayMonth = currentDate.getMonth(); 
            let displayYear = currentDate.getFullYear();
            let selectedDateStr = null; 

            const monthNames = ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"];

            function initCalendar() {
                // 如果当前月份没有重要的税务事件，默认跳转到繁忙的 4月（税季）
                const monthStr = String(displayMonth + 1).padStart(2, '0');
                const hasEvents = Object.keys(calendarData).some(key => key.startsWith(monthStr));
                if (!hasEvents) displayMonth = 3; // 4月 (0-indexed)
                renderCalendar();
            }

            function renderCalendar() {
                const grid = document.getElementById('calendarGrid');
                grid.innerHTML = '';
                document.getElementById('currentMonthYear').textContent = `${displayYear}年 ${monthNames[displayMonth]}`;

                const firstDay = new Date(displayYear, displayMonth, 1).getDay();
                const daysInMonth = new Date(displayYear, displayMonth + 1, 0).getDate();
                const today = new Date();

                // 填补月前的空白天数
                for (let i = 0; i < firstDay; i++) {
                    const emptyCell = document.createElement('div');
                    emptyCell.className = "p-2";
                    grid.appendChild(emptyCell);
                }

                const monthStr = String(displayMonth + 1).padStart(2, '0');
                let monthEvents = [];

                for (let i = 1; i <= daysInMonth; i++) {
                    const dayCell = document.createElement('div');
                    const dayStr = String(i).padStart(2, '0');
                    const dateKey = `${monthStr}-${dayStr}`;
                    
                    const events = calendarData[dateKey];
                    const hasEvents = events && events.length > 0;
                    if(hasEvents) monthEvents.push({ dateKey, day: i, events });

                    const isToday = i === today.getDate() && displayMonth === today.getMonth() && displayYear === today.getFullYear();
                    const isSelected = selectedDateStr === dateKey;

                    let classes = "relative flex flex-col items-center justify-center p-2 h-10 w-10 mx-auto rounded-full cursor-pointer transition-colors text-sm font-medium ";
                    
                    if (isSelected) {
                        classes += "bg-indigo-600 text-white shadow-md";
                    } else if (isToday) {
                        classes += "bg-indigo-50 text-indigo-700 border border-indigo-200";
                    } else if (hasEvents) {
                        classes += "hover:bg-slate-100 text-slate-800 font-bold";
                    } else {
                        classes += "hover:bg-slate-100 text-slate-600";
                    }

                    dayCell.className = classes;
                    dayCell.innerHTML = `<span>${i}</span>`;

                    if (hasEvents) {
                        const dotContainer = document.createElement('div');
                        dotContainer.className = "flex space-x-1 absolute bottom-1";
                        events.slice(0, 3).forEach(ev => {
                            const dot = document.createElement('div');
                            const colorClass = isSelected ? 'bg-white opacity-80' : themeColors[ev.color].dot;
                            dot.className = `w-1.5 h-1.5 rounded-full ${colorClass}`;
                            dotContainer.appendChild(dot);
                        });
                        dayCell.appendChild(dotContainer);
                    }

                    dayCell.onclick = () => {
                        if (hasEvents) {
                            selectedDateStr = dateKey;
                            renderCalendar();
                            renderDateDetails(dateKey);
                        }
                    };

                    grid.appendChild(dayCell);
                }

                // 默认视角：如果没有选中特定日期，显示全月事件汇总
                if (!selectedDateStr || !selectedDateStr.startsWith(monthStr)) {
                    renderMonthDetails(monthEvents);
                }
            }

            function renderMonthDetails(monthEvents) {
                const container = document.getElementById('dateDetailsContainer');
                const header = document.getElementById('selectedDateHeader');
                document.getElementById('resetMonthViewBtn').classList.add('hidden');
                
                header.textContent = `${monthNames[displayMonth]} 重要节点汇总`;
                container.innerHTML = '';

                if (monthEvents.length === 0) {
                    container.innerHTML = `
                        <div class="h-full flex flex-col items-center justify-center text-slate-400 p-6 text-center">
                            <i class="fa-regular fa-calendar-xmark text-4xl mb-3 opacity-30"></i>
                            <p class="text-sm">本月无重大联邦/州级税务截止日。</p>
                            <p class="text-xs mt-2 opacity-60">注：常规按月申报的销售及工资税除外。</p>
                        </div>
                    `;
                    return;

                monthEvents.forEach(item => {
                    const dayBlock = document.createElement('div');
                    dayBlock.className = "relative pl-4 border-l-2 border-indigo-200 mb-6 pb-2";
                    
                    let html = `<h5 class="font-bold text-indigo-700 mb-3 absolute -left-[5px] -top-1 bg-slate-50/80 py-1"><div class="w-2 h-2 rounded-full bg-indigo-500 inline-block mr-2 ring-4 ring-indigo-100"></div>${item.day}日</h5><div class="mt-5 space-y-3">`;
                    
                    item.events.forEach(ev => { html += generateEventCard(ev); });
                    html += `</div>`;
                    dayBlock.innerHTML = html;
                    container.appendChild(dayBlock);
                });

            function renderDateDetails(dateKey) {

                const header = document.getElementById('selectedDateHeader');

                header.textContent = `${parseInt(m)}月${parseInt(d)}日 申报详情`;

                        <h6 class="font-semibold text-slate-800 text-sm leading-snug">${ev.title}</h6>

                    </div>
                `;

            function toggleCalendar() {
                calendarModal.classList.toggle('hidden');

                    initCalendar(); // 打开时初始化日历

            openCalendarBtn.addEventListener('click', toggleCalendar);
            closeCalendarBtn.addEventListener('click', toggleCalendar);
            calendarModal.querySelector('.modal-overlay').addEventListener('click', toggleCalendar);

            // Render Sidebar
            function renderStateList(filterText = '') {
                stateList.innerHTML = '';
                const sortedKeys = Object.keys(taxDatabase).sort((a, b) => {
                    // Pin GA, TX, CA, WA, NY to top
                    const pins = ["GA", "TX", "CA", "WA", "NY"];
                    if(pins.includes(a) && !pins.includes(b)) return -1;
                    if(!pins.includes(a) && pins.includes(b)) return 1;
                    return a.localeCompare(b);
                });

                sortedKeys.forEach(key => {
                    const data = taxDatabase[key];
                    const searchStr = `${data.name_cn} ${data.name_en} ${data.abbr}`.toLowerCase();

                    const btn = document.createElement('button');

                        btn.classList.remove('border-transparent');
                        
                        if (window.innerWidth < 768) toggleSidebar();
                        showStateData(key);

                    stateList.appendChild(btn);
                });
            }

            function showStateData(stateKey) {
                const data = taxDatabase[stateKey];
                
                document.getElementById('stateAbbr').textContent = data.abbr;

                    if (tag.includes("重点") || tag.includes("🚨") || tag.includes("高")) color = "bg-rose-50 text-rose-700 border-rose-100";
