<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美国州税检索表</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        /* Dark scrollbar for sidebar */
        #sidebar::-webkit-scrollbar-thumb { background: #475569; }
        #sidebar::-webkit-scrollbar-thumb:hover { background: #64748b; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        
        /* Subtle background pattern for main content */
        .bg-pattern {
            background-color: #f8fafc;
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-800 h-screen flex overflow-hidden">

    <!-- Mobile Drawer Overlay -->
    <div id="mobile-overlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-40 hidden md:hidden transition-all duration-300" onclick="toggleSidebar()"></div>

    <!-- Sidebar (Dark Mode Vibe) -->
    <aside id="sidebar" class="fixed md:static inset-y-0 left-0 w-72 bg-slate-900 border-r border-slate-800 flex flex-col z-50 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out h-full shadow-2xl md:shadow-none">
        <div class="p-5 border-b border-slate-800/50 bg-slate-900/95 sticky top-0 z-10">
            <h1 class="text-xl font-black text-white flex items-center tracking-tight" id="app-title">
                <i class="fa-solid fa-scale-balanced text-indigo-400 mr-2.5"></i> 美国州税检索表
            </h1>
            <div class="mt-5 relative group">
                <i class="fa-solid fa-search absolute left-3.5 top-1/2 transform -translate-y-1/2 text-slate-500 group-focus-within:text-indigo-400 transition-colors"></i>
                <input type="text" id="searchInput" class="w-full bg-slate-800 border border-slate-700 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white placeholder-slate-500 focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 focus:bg-slate-900 transition-all shadow-inner" placeholder="搜索州名 (中/英/缩写)..." oninput="filterStates()">
            </div>
        </div>
        <div class="flex-1 overflow-y-auto p-3 space-y-1" id="stateList">
            <!-- States will be populated here -->
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full w-full overflow-hidden bg-pattern relative">
        <!-- Header (Glassmorphism) -->
        <header class="bg-white/80 backdrop-blur-md border-b border-slate-200/80 px-4 md:px-6 py-3.5 flex items-center justify-between z-10 shadow-sm sticky top-0">
            <div class="flex items-center">
                <button onclick="toggleSidebar()" class="md:hidden mr-4 w-10 h-10 flex items-center justify-center rounded-lg bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 hover:text-indigo-600 transition-all shadow-sm">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div id="federal-protection-banner" class="hidden lg:flex items-center text-xs font-bold bg-gradient-to-r from-emerald-50 to-teal-50 text-emerald-700 px-3 py-1.5 rounded-lg border border-emerald-100 shadow-sm">
                    <div class="bg-emerald-100 p-1 rounded mr-2"><i class="fa-solid fa-shield-halved text-emerald-600"></i></div>
                    <span id="federal-text">受联邦法 PL 86-272 保护：跨州纯批发销售免缴多数所得税</span>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="openCalendar()" class="text-sm font-bold text-slate-700 hover:text-indigo-700 bg-white hover:bg-indigo-50 px-4 py-2 rounded-xl transition-all shadow-sm border border-slate-200 flex items-center group">
                    <i class="fa-regular fa-calendar group-hover:scale-110 transition-transform mr-2 text-indigo-500"></i> <span id="nav-calendar">申报日历</span>
                </button>
                <button onclick="toggleLang()" id="langBtn" class="text-sm font-black text-slate-700 hover:text-slate-900 bg-white hover:bg-slate-100 px-4 py-2 rounded-xl transition-all shadow-sm border border-slate-200">
                    中 / EN
                </button>
            </div>
        </header>

        <!-- Dynamic Content Area -->
        <div id="content-area" class="flex-1 overflow-y-auto p-4 md:p-8 relative hidden flex-col">
            <!-- Content populated by JS -->
        </div>
        
        <!-- Empty State -->
        <div id="empty-state" class="flex-1 flex flex-col items-center justify-center p-8 text-center relative z-0">
            <div class="absolute inset-0 flex items-center justify-center opacity-40 pointer-events-none">
                <div class="w-96 h-96 bg-indigo-200 rounded-full blur-[100px]"></div>
            </div>
            <div class="relative z-10 w-28 h-28 bg-white shadow-xl shadow-slate-200/50 rounded-full flex items-center justify-center mb-6 border border-slate-100">
                <i class="fa-solid fa-map-location-dot text-5xl text-indigo-400 bg-clip-text"></i>
            </div>
            <h2 class="text-2xl font-black text-slate-800 mb-2 relative z-10" id="empty-title">欢迎使用税务合规引擎</h2>
            <p class="text-slate-500 font-medium relative z-10 max-w-md" id="empty-text">请从左侧栏选择一个目标州，系统将自动加载并分析该州的纳税义务、税率及合规节点。</p>
        </div>
    </main>

    <!-- Calendar Modal -->
    <div id="calendar-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden transform scale-95 transition-transform duration-300" id="calendar-modal-content">
            <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-gradient-to-r from-slate-50 to-white">
                <h3 class="text-lg font-black text-slate-800 flex items-center tracking-tight">
                    <div class="w-8 h-8 rounded-lg bg-indigo-100 text-indigo-600 flex items-center justify-center mr-3"><i class="fa-regular fa-calendar-check"></i></div>
                    <span id="modal-calendar-title">全美税务申报日历</span>
                </h3>
                <button onclick="closeCalendar()" class="w-8 h-8 flex items-center justify-center rounded-full text-slate-400 hover:text-rose-500 hover:bg-rose-50 transition-colors">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <div class="flex flex-col md:flex-row flex-1 overflow-hidden h-full">
                <!-- Left: Calendar View -->
                <div class="w-full md:w-1/2 border-r border-slate-200 p-6 flex flex-col bg-white">
                    <div class="flex justify-between items-center mb-6">
                        <button onclick="changeMonth(-1)" class="w-8 h-8 flex items-center justify-center hover:bg-slate-100 rounded-lg text-slate-600 transition-colors border border-transparent hover:border-slate-200"><i class="fa-solid fa-chevron-left"></i></button>
                        <h4 id="calendar-month-year" class="text-lg font-black text-slate-800 tracking-tight">2026年 4月</h4>
                        <button onclick="changeMonth(1)" class="w-8 h-8 flex items-center justify-center hover:bg-slate-100 rounded-lg text-slate-600 transition-colors border border-transparent hover:border-slate-200"><i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                    <div class="calendar-grid text-center mb-2" id="calendar-weekdays">
                        <!-- Weekdays -->
                    </div>
                    <div class="calendar-grid text-center flex-1" id="calendar-days">
                        <!-- Days populated by JS -->
                    </div>
                </div>
                
                <!-- Right: Tasks View -->
                <div class="w-full md:w-1/2 p-6 overflow-y-auto bg-slate-50/50" id="calendar-tasks">
                    <!-- Tasks populated by JS -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- Initialization & State ---
        let currentLang = 'zh';
        let activeState = null;
        let currentMonth = 3; // April (0-indexed)
        let currentYear = new Date().getFullYear();
        let selectedDate = null;

        const i18n = {
            zh: {
                title: "美国州税检索表", search: "搜索州名 (中/英/缩写)...", federalInfo: "受联邦法 PL 86-272 保护：跨州纯批发销售免缴多数所得税",
                navCalendar: "申报日历", emptyTitle: "欢迎使用税务合规引擎", emptyText: "请从左侧栏选择一个目标州，系统将自动加载并分析该州的纳税义务、税率及合规节点。",
                nexus: "纳税义务触发条件", rate: "税率", calc: "计算方法", deadline: "申报时间", penalty: "晚交惩罚",
                dlCert: "下载转售证明", onlineApply: "在线申请", calendarTitle: "全美税务申报日历", close: "关闭",
                months: ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"],
                weekDays: ["日", "一", "二", "三", "四", "五", "六"],
                taskTips: "本月的重要合规节点汇总如下。点击左侧具体日期可查看当天的任务。"
            },
            en: {
                title: "US State Tax Engine", search: "Search states...", federalInfo: "PL 86-272 Protected: Interstate wholesale is mostly exempt from net income tax",
                navCalendar: "Compliance Calendar", emptyTitle: "Welcome to Tax Engine", emptyText: "Select a state from the sidebar to view tax obligations, rates, and compliance nodes.",
                nexus: "Nexus Threshold", rate: "Tax Rate", calc: "Calculation", deadline: "Deadline", penalty: "Penalty",
                dlCert: "Download Certificate", onlineApply: "Apply Online", calendarTitle: "Compliance Calendar", close: "Close",
                months: ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"],
                weekDays: ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"],
                taskTips: "Key compliance nodes for this month. Click a specific date on the left for daily tasks."
            }
        };

        const stateNamesMap = {
            "AL": ["阿拉巴马", "Alabama"], "AK": ["阿拉斯加", "Alaska"], "AZ": ["亚利桑那", "Arizona"],
            "AR": ["阿肯色", "Arkansas"], "CA": ["加利福尼亚", "California"], "CO": ["科罗拉多", "Colorado"],
            "CT": ["康涅狄格", "Connecticut"], "DE": ["特拉华", "Delaware"], "FL": ["佛罗里达", "Florida"],
            "GA": ["佐治亚 (总部)", "Georgia"], "HI": ["夏威夷", "Hawaii"], "ID": ["爱达荷", "Idaho"],
            "IL": ["伊利诺伊", "Illinois"], "IN": ["印第安纳", "Indiana"], "IA": ["爱荷华", "Iowa"],
            "KS": ["堪萨斯", "Kansas"], "KY": ["肯塔基", "Kentucky"], "LA": ["路易斯安那", "Louisiana"],
            "ME": ["缅因", "Maine"], "MD": ["马里兰", "Maryland"], "MA": ["马萨诸塞", "Massachusetts"],
            "MI": ["密歇根", "Michigan"], "MN": ["明尼苏达", "Minnesota"], "MS": ["密西西比", "Mississippi"],
            "MO": ["密苏里", "Missouri"], "MT": ["蒙大拿", "Montana"], "NE": ["内布拉斯加", "Nebraska"],
            "NV": ["内华达", "Nevada"], "NH": ["新罕布什尔", "New Hampshire"], "NJ": ["新泽西", "New Jersey"],
            "NM": ["新墨西哥", "New Mexico"], "NY": ["纽约", "New York"], "NC": ["北卡罗来纳", "North Carolina"],
            "ND": ["北达科他", "North Dakota"], "OH": ["俄亥俄", "Ohio"], "OK": ["俄克拉荷马", "Oklahoma"],
            "OR": ["俄勒冈", "Oregon"], "PA": ["宾夕法尼亚", "Pennsylvania"], "RI": ["罗德岛", "Rhode Island"],
            "SC": ["南卡罗来纳", "South Carolina"], "SD": ["南达科他", "South Dakota"], "TN": ["田纳西", "Tennessee"],
            "TX": ["德克萨斯", "Texas"], "UT": ["犹他", "Utah"], "VT": ["佛蒙特", "Vermont"],
            "VA": ["弗吉尼亚", "Virginia"], "WA": ["华盛顿州 (西海岸)", "Washington State"], "WV": ["西弗吉尼亚", "West Virginia"],
            "WI": ["威斯康星", "Wisconsin"], "WY": ["怀俄明", "Wyoming"], "DC": ["华盛顿特区 (首都)", "Washington D.C."]
        };

        const stateCitRates_zh = {
            "AL": "6.5% (固定)", "AK": "2.0% - 9.4% (阶梯)", "AZ": "4.9% (固定)", "AR": "1.0% - 4.3% (阶梯)",
            "CA": "8.84% (固定)", "CO": "4.4% (固定)", "CT": "7.5% (固定)", "DE": "8.7% (固定)", "FL": "5.5% (固定)",
            "GA": "5.75% (固定)", "HI": "4.4% - 6.4% (阶梯)", "ID": "5.8% (固定)", "IL": "9.5% (含附加税)",
            "IN": "4.9% (固定)", "IA": "5.5% - 7.1% (阶梯)", "KS": "7.0% (固定)", "KY": "5.0% (固定)",
            "LA": "3.5% - 7.5% (阶梯)", "ME": "3.5% - 8.93% (阶梯)", "MD": "8.25% (固定)",
            "MA": "8.0% (固定)", "MI": "6.0% (固定)", "MN": "9.8% (固定)", "MS": "4.0% - 5.0% (阶梯)",
            "MO": "4.0% (固定)", "MT": "6.75% (固定)", "NE": "5.58% - 7.25% (阶梯)", "NV": "无企业所得税",
            "NH": "7.5% (固定)", "NJ": "6.5% - 9.0% (阶梯)", "NM": "4.8% - 5.9% (阶梯)",
            "NY": "7.25% (固定)", "NC": "2.5% (固定)", "ND": "1.41% - 4.31% (阶梯)", "OH": "无企业所得税",
            "OK": "4.0% (固定)", "OR": "6.6% - 7.6% (阶梯)", "PA": "8.49% (固定)", "RI": "7.0% (固定)",
            "SC": "5.0% (固定)", "SD": "无企业所得税", "TN": "6.5% (固定)", "TX": "无企业所得税",
            "UT": "4.65% (固定)", "VT": "6.0% - 8.5% (阶梯)", "VA": "6.0% (固定)", "WA": "无企业所得税",
            "WV": "6.5% (固定)", "WI": "7.9% (固定)", "WY": "无企业所得税", "DC": "8.25% (固定)"
        };

        const stateCitRates_en = {
            "AL": "6.5% (Flat)", "AK": "2.0% - 9.4% (Brackets)", "AZ": "4.9% (Flat)", "AR": "1.0% - 4.3% (Brackets)",
            "CA": "8.84% (Flat)", "CO": "4.4% (Flat)", "CT": "7.5% (Flat)", "DE": "8.7% (Flat)", "FL": "5.5% (Flat)",
            "GA": "5.75% (Flat)", "HI": "4.4% - 6.4% (Brackets)", "ID": "5.8% (Flat)", "IL": "9.5% (Incl. Surtax)",
            "IN": "4.9% (Flat)", "IA": "5.5% - 7.1% (Brackets)", "KS": "7.0% (Flat)", "KY": "5.0% (Flat)",
            "LA": "3.5% - 7.5% (Brackets)", "ME": "3.5% - 8.93% (Brackets)", "MD": "8.25% (Flat)",
            "MA": "8.0% (Flat)", "MI": "6.0% (Flat)", "MN": "9.8% (Flat)", "MS": "4.0% - 5.0% (Brackets)",
            "MO": "4.0% (Flat)", "MT": "6.75% (Flat)", "NE": "5.58% - 7.25% (Brackets)", "NV": "No CIT",
            "NH": "7.5% (Flat)", "NJ": "6.5% - 9.0% (Brackets)", "NM": "4.8% - 5.9% (Brackets)",
            "NY": "7.25% (Flat)", "NC": "2.5% (Flat)", "ND": "1.41% - 4.31% (Brackets)", "OH": "No CIT",
            "OK": "4.0% (Flat)", "OR": "6.6% - 7.6% (Brackets)", "PA": "8.49% (Flat)", "RI": "7.0% (Flat)",
            "SC": "5.0% (Flat)", "SD": "No CIT", "TN": "6.5% (Flat)", "TX": "No CIT",
            "UT": "4.65% (Flat)", "VT": "6.0% - 8.5% (Brackets)", "VA": "6.0% (Flat)", "WA": "No CIT",
            "WV": "6.5% (Flat)", "WI": "7.9% (Flat)", "WY": "No CIT", "DC": "8.25% (Flat)"
        };

        const formula = (text) => `<div class="bg-indigo-50/70 p-4 rounded-xl border border-indigo-100/60 shadow-inner my-3 font-mono text-sm text-indigo-800 flex items-start"><i class="fa-solid fa-calculator text-indigo-400 mt-0.5 mr-2.5"></i><span class="leading-relaxed font-semibold">${text}</span></div>`;

        const cit = (rate_zh, rate_en, threshold_zh, threshold_en, calcFormula_zh, calcFormula_en, pl86272 = true, extraNote_zh = "", extraNote_en = "") => ({
            type_zh: "企业所得税", type_en: "Corporate Income Tax (CIT)", icon: "fa-landmark text-emerald-500",
            nexus_zh: `年度本州总销售额达到或超过 <b class="text-slate-900">${threshold_zh}</b>。` + (pl86272 ? `<br><span class='text-emerald-700 bg-emerald-50 px-2 py-1 rounded border border-emerald-100 text-xs mt-2 inline-flex items-center font-medium'><i class='fa-solid fa-shield-halved mr-1.5'></i> 受联邦法保护，纯批发免交此类净所得税</span>` : ""),
            nexus_en: `Gross sales into the state reach or exceed <b class="text-slate-900">${threshold_en}</b>.` + (pl86272 ? `<br><span class='text-emerald-700 bg-emerald-50 px-2 py-1 rounded border border-emerald-100 text-xs mt-2 inline-flex items-center font-medium'><i class='fa-solid fa-shield-halved mr-1.5'></i> Protected by PL 86-272 for pure wholesale</span>` : ""),
            rate_zh: rate_zh, rate_en: rate_en,
            calc_zh: formula(calcFormula_zh) + extraNote_zh, calc_en: formula(calcFormula_en) + extraNote_en,
            deadline_zh: "财年结束后第4个月15日 (可延期)。", deadline_en: "15th day of the 4th month after FY end.",
            penalty_zh: "晚交及晚申报通常各按每月 5% 累计，最高 25%。", penalty_en: "Usually 5% per month late penalty, max 25%."
        });

        const getGenericSalesTax = (stateName_zh, stateName_en, salesThreshold, certName_zh = "多州通用转售证明 (MTC)", certName_en = "Multi-State Resale Cert (MTC)", certLink = "https://www.mtc.gov/wp-content/uploads/2023/01/Unif-Resale-Cert-revised-10-14-22.pdf") => ({
            type_zh: "销售及使用税", type_en: "Sales & Use Tax", icon: "fa-cash-register text-slate-400",
            nexus_zh: `年度本州总销售额达到或超过 <b class="text-slate-900">${salesThreshold}</b>。<br><span class='text-amber-700 bg-amber-50 px-2 py-1 rounded border border-amber-100/60 text-xs mt-2 inline-flex items-center font-medium'><i class='fa-solid fa-circle-info mr-1.5'></i> 注意：B2B 免税批发额同样计入门槛</span>`,
            nexus_en: `Annual gross sales reach or exceed <b class="text-slate-900">${salesThreshold}</b>.<br><span class='text-amber-700 bg-amber-50 px-2 py-1 rounded border border-amber-100/60 text-xs mt-2 inline-flex items-center font-medium'><i class='fa-solid fa-circle-info mr-1.5'></i> Note: B2B exempt sales count towards threshold</span>`,
            rate_zh: "州税率 + 地方税率", rate_en: "State + Local Rate",
            calc_zh: formula("应纳税额 = 应税销售总额 × 综合税率") + `<span class='font-bold text-slate-700 block mb-1 mt-3'>合规要求：</span>必须注册税号，收集客户的 <b class="text-indigo-600">${certName_zh}</b>，并按时进行零申报。`,
            calc_en: formula("Tax Due = Taxable Sales × Combined Rate") + `<span class='font-bold text-slate-700 block mb-1 mt-3'>Practice:</span> Must register, collect <b class="text-indigo-600">${certName_en}</b>, and file zero returns.`,
            deadline_zh: "依州指派频率 (季报或年报)", deadline_en: "Assigned frequency (Quarterly/Annually)",
            penalty_zh: "未进行零申报面临 $50-$100 晚申报固定罚款。", penalty_en: "$50-$100 fixed penalty for missing zero returns.",
            cert_zh: { name: certName_zh, link: certLink }, cert_en: { name: certName_en, link: certLink }
        });

        const inventoryTax = (rate_zh, rate_en, calcText_zh, calcText_en, note_zh, note_en) => ({
            type_zh: "商业库存财产税", type_en: "Business Inventory Tax", icon: "fa-boxes-stacked text-purple-500",
            nexus_zh: "在本州拥有实物库存 (如海外仓、第三方代发仓、亚马逊 FBA)。<br><span class='text-purple-700 bg-purple-50 px-2 py-1 rounded border border-purple-100 text-xs mt-2 inline-flex items-center font-bold'><i class='fa-solid fa-triangle-exclamation mr-1.5'></i> 财产税性质，不受联邦法保护！</span>",
            nexus_en: "Owning physical inventory in state (e.g. 3PL, FBA).<br><span class='text-purple-700 bg-purple-50 px-2 py-1 rounded border border-purple-100 text-xs mt-2 inline-flex items-center font-bold'><i class='fa-solid fa-triangle-exclamation mr-1.5'></i> Property tax nature, NOT protected by PL 86-272!</span>",
            rate_zh: rate_zh, rate_en: rate_en,
            calc_zh: formula(calcText_zh) + note_zh, calc_en: formula(calcText_en) + note_en,
            deadline_zh: "多为 1月1日 评估，3-4月份提交财产申报。", deadline_en: "Assessed Jan 1, renditions due March-April.",
            penalty_zh: "未申报面临 10% 评估价值的重罚。", penalty_en: "10% penalty on assessed value."
        });

        function toggleLang() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            document.getElementById('langBtn').innerText = currentLang === 'zh' ? '中 / EN' : 'EN / 中';
            applyTranslations();
            renderStateList(document.getElementById('searchInput').value);
            if (activeState) selectState(activeState);
            renderCalendar();
        }

        function applyTranslations() {
            const dict = i18n[currentLang];
            document.getElementById('app-title').innerHTML = `<i class="fa-solid fa-scale-balanced text-indigo-400 mr-2.5"></i> ${dict.title}`;
            document.getElementById('searchInput').placeholder = dict.search;
            document.getElementById('federal-text').innerText = dict.federalInfo;
            document.getElementById('nav-calendar').innerText = dict.navCalendar;
            document.getElementById('empty-title').innerText = dict.emptyTitle;
            document.getElementById('empty-text').innerText = dict.emptyText;
            document.getElementById('modal-calendar-title').innerHTML = `<div class="w-8 h-8 rounded-lg bg-indigo-100 text-indigo-600 flex items-center justify-center mr-3"><i class="fa-regular fa-calendar-check"></i></div> ${dict.calendarTitle}`;
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-overlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
            overlay.classList.toggle('opacity-0');
        }

        function filterStates() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            renderStateList(query);
        }

        function renderStateList(query = "") {
            const list = document.getElementById('stateList');
            list.innerHTML = "";
            
            Object.values(taxDatabase).forEach(state => {
                const name = currentLang === 'zh' ? state.name_zh : state.name_en;
                if (name.toLowerCase().includes(query) || state.abbr.toLowerCase().includes(query)) {
                    const btn = document.createElement('button');
                    const isActive = activeState === state.abbr;
                    
                    // Dark mode friendly styles for sidebar items
                    btn.className = `w-full text-left px-4 py-3.5 rounded-xl mb-1.5 transition-all duration-200 flex items-center justify-between group ${
                        isActive ? 'bg-indigo-600 text-white shadow-md shadow-indigo-900/50 ring-1 ring-indigo-500' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'
                    }`;
                    btn.onclick = () => selectState(state.abbr);
                    
                    const tags = (currentLang === 'zh' ? state.tags_zh : state.tags_en).map(tag => {
                        const isDanger = tag.includes('🚨');
                        const isInventory = tag.includes('📦');
                        const isHQ = tag.includes('🏢');
                        // Tag colors optimized for dark sidebar
                        let tagClass = isActive ? "bg-indigo-500 text-white border-indigo-400" : "bg-slate-800/50 text-slate-400 border-slate-700 group-hover:bg-slate-700";
                        if(isDanger) tagClass = isActive ? "bg-rose-500 text-white border-rose-400" : "bg-rose-900/30 text-rose-300 border-rose-800/50 group-hover:bg-rose-900/50";
                        else if(isInventory) tagClass = isActive ? "bg-purple-500 text-white border-purple-400" : "bg-purple-900/30 text-purple-300 border-purple-800/50 group-hover:bg-purple-900/50";
                        else if(isHQ) tagClass = isActive ? "bg-indigo-800 text-white border-indigo-500" : "bg-indigo-900/30 text-indigo-300 border-indigo-800/50 group-hover:bg-indigo-900/50";
                        return `<span class="text-[10px] px-1.5 py-0.5 rounded border ${tagClass}">${tag}</span>`;
                    }).join('');

                    btn.innerHTML = `
                        <div class="flex flex-col">
                            <span class="font-medium tracking-wide ${isActive ? 'text-white font-bold' : ''}">${name} <span class="text-xs font-normal ${isActive ? 'text-indigo-200' : 'text-slate-500'} ml-1">${state.abbr}</span></span>
                            <div class="flex flex-wrap gap-1.5 mt-2">${tags}</div>
                        </div>
                        <i class="fa-solid fa-chevron-right text-xs ${isActive ? 'text-indigo-300' : 'text-slate-600 group-hover:text-slate-400'}"></i>
                    `;
                    list.appendChild(btn);
                }
            });
        }

        function selectState(abbr) {
            activeState = abbr;
            if(window.innerWidth < 768) toggleSidebar();
            
            document.getElementById('empty-state').classList.add('hidden');
            const contentArea = document.getElementById('content-area');
            contentArea.classList.remove('hidden');
            contentArea.classList.add('flex');
            
            const state = taxDatabase[abbr];
            const dict = i18n[currentLang];
            const name = currentLang === 'zh' ? state.name_zh : state.name_en;
            const note = currentLang === 'zh' ? state.note_zh : state.note_en;
            
            renderStateList(document.getElementById('searchInput').value);
            
            let html = `
                <div class="mb-8 flex justify-between items-end relative z-10">
                    <div>
                        <h2 class="text-3xl md:text-4xl font-black text-slate-800 tracking-tight flex items-center">
                            ${name} <span class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-lg text-xl font-bold ml-4 border border-indigo-200 shadow-sm">${state.abbr}</span>
                        </h2>
                        <p class="text-slate-600 mt-3 flex items-start text-sm md:text-base font-medium max-w-3xl leading-relaxed">
                            <i class="fa-solid fa-circle-info text-indigo-500 mt-1 mr-2.5 text-lg"></i>
                            <span>${note}</span>
                        </p>
                    </div>
                </div>
                <div class="space-y-6 relative z-10 pb-10">
            `;
            
            state.taxes.forEach((tax) => {
                const isWarning = tax.icon.includes('rose');
                const isPurple = tax.icon.includes('purple');
                
                // Card header gradients and border styling
                let headerBg = "bg-gradient-to-r from-slate-50 to-white"; let borderColor = "border-slate-200"; let leftBorder = "border-l-4 border-l-emerald-500";
                if(isWarning) { headerBg = "bg-gradient-to-r from-rose-50/50 to-white"; borderColor = "border-rose-200/60"; leftBorder = "border-l-4 border-l-rose-500"; }
                else if(isPurple) { headerBg = "bg-gradient-to-r from-purple-50/50 to-white"; borderColor = "border-purple-200/60"; leftBorder = "border-l-4 border-l-purple-500"; }
                else if(tax.icon.includes('cash-register')) { leftBorder = "border-l-4 border-l-slate-400"; }
                
                const taxName = currentLang === 'zh' ? tax.type_zh : tax.type_en;
                const nexus = currentLang === 'zh' ? tax.nexus_zh : tax.nexus_en;
                const rate = currentLang === 'zh' ? tax.rate_zh : tax.rate_en;
                const calc = currentLang === 'zh' ? tax.calc_zh : tax.calc_en;
                const deadline = currentLang === 'zh' ? tax.deadline_zh : tax.deadline_en;
                const penalty = currentLang === 'zh' ? tax.penalty_zh : tax.penalty_en;
                
                let certBtn = "";
                if(tax.cert_zh) {
                    const cert = currentLang === 'zh' ? tax.cert_zh : tax.cert_en;
                    const isOnline = cert.name.includes("在线") || cert.name.includes("Online");
                    const btnText = isOnline ? dict.onlineApply : dict.dlCert;
                    const btnIcon = isOnline ? "fa-laptop" : "fa-cloud-arrow-down";
                    certBtn = `<a href="${cert.link}" target="_blank" class="mt-4 inline-flex items-center text-sm font-bold text-slate-700 bg-white border border-slate-200 hover:bg-indigo-50 hover:text-indigo-700 hover:border-indigo-200 px-4 py-2 rounded-xl transition-all shadow-sm group"><i class="fa-solid ${btnIcon} mr-2 text-slate-400 group-hover:text-indigo-500 transition-colors"></i> ${btnText}: ${cert.name}</a>`;
                }

                html += `
                    <div class="bg-white border rounded-2xl shadow-md shadow-slate-200/50 overflow-hidden transform transition-all duration-300 hover:shadow-xl hover:-translate-y-1 ${borderColor} ${leftBorder}">
                        <div class="px-5 py-3.5 border-b flex items-center ${headerBg} ${borderColor}">
                            <div class="w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center mr-3.5 border border-slate-100">
                                <i class="fa-solid ${tax.icon} text-lg"></i>
                            </div>
                            <h3 class="font-black text-slate-800 text-lg tracking-tight">${taxName}</h3>
                        </div>
                        <div class="p-5 md:p-7 grid grid-cols-1 lg:grid-cols-2 gap-8">
                            <div class="space-y-6">
                                <div>
                                    <h4 class="text-xs font-black text-slate-400 uppercase tracking-wider mb-2.5 flex items-center"><i class="fa-solid fa-link mr-2"></i> ${dict.nexus}</h4>
                                    <div class="text-slate-600 text-sm leading-relaxed">${nexus}</div>
                                </div>
                                <div>
                                    <h4 class="text-xs font-black text-slate-400 uppercase tracking-wider mb-2.5 flex items-center"><i class="fa-solid fa-percent mr-2"></i> ${dict.rate}</h4>
                                    <p class="text-slate-800 font-bold text-[15px] bg-slate-50 inline-block px-3 py-1.5 rounded-lg border border-slate-200 shadow-sm">${rate}</p>
                                </div>
                            </div>
                            <div class="space-y-6">
                                <div>
                                    <h4 class="text-xs font-black text-slate-400 uppercase tracking-wider mb-2.5 flex items-center"><i class="fa-solid fa-money-bill-transfer mr-2"></i> ${dict.calc}</h4>
                                    <div class="text-slate-600 text-sm">${calc}</div>
                                    ${certBtn}
                                </div>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 bg-slate-50/50 p-4 rounded-xl border border-slate-100">
                                    <div>
                                        <h4 class="text-xs font-black text-slate-400 uppercase tracking-wider mb-2 flex items-center"><i class="fa-regular fa-clock mr-2"></i> ${dict.deadline}</h4>
                                        <p class="text-slate-700 text-sm font-semibold">${deadline}</p>
                                    </div>
                                    <div>
                                        <h4 class="text-xs font-black text-slate-400 uppercase tracking-wider mb-2 flex items-center"><i class="fa-solid fa-triangle-exclamation mr-2"></i> ${dict.penalty}</h4>
                                        <p class="text-rose-600 font-medium text-sm">${penalty}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
            html += `</div>`;
            contentArea.innerHTML = html;
        }

        function openCalendar() {
            const modal = document.getElementById('calendar-modal');
            const content = document.getElementById('calendar-modal-content');
            modal.classList.remove('hidden');
            // Small delay for transition to trigger
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
            }, 10);
            renderCalendar();
        }

        function closeCalendar() {
            const modal = document.getElementById('calendar-modal');
            const content = document.getElementById('calendar-modal-content');
            modal.classList.add('opacity-0');
            content.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        function changeMonth(delta) {
            currentMonth += delta;
            if(currentMonth > 11) { currentMonth = 0; currentYear++; }
            if(currentMonth < 0) { currentMonth = 11; currentYear--; }
            selectedDate = null;
            renderCalendar();
        }

        function renderCalendar() {
            const dict = i18n[currentLang];
            document.getElementById('calendar-month-year').innerText = currentLang === 'zh' ? `${currentYear}年 ${dict.months[currentMonth]}` : `${dict.months[currentMonth]} ${currentYear}`;
            
            const wdContainer = document.getElementById('calendar-weekdays');
            wdContainer.innerHTML = dict.weekDays.map(d => `<div class="text-[11px] font-black text-slate-400 py-2 uppercase tracking-wider">${d}</div>`).join('');
            
            const daysContainer = document.getElementById('calendar-days');
            daysContainer.innerHTML = '';
            
            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            
            for(let i=0; i<firstDay; i++) {
                daysContainer.innerHTML += `<div></div>`;
            }
            
            const monthStr = String(currentMonth + 1).padStart(2, '0');
            const eventsThisMonth = taxEvents.filter(e => e.date.startsWith(monthStr + "-"));
            
            for(let i=1; i<=daysInMonth; i++) {
                const dayStr = String(i).padStart(2, '0');
                const dateKey = `${monthStr}-${dayStr}`;
                const hasEvents = eventsThisMonth.some(e => e.date === dateKey);
                
                const isSelected = selectedDate === dateKey;
                const isToday = new Date().getDate() === i && new Date().getMonth() === currentMonth;
                
                let btnClass = "w-full aspect-square flex flex-col items-center justify-center rounded-xl text-sm font-bold transition-all duration-200 ";
                
                if(isSelected) btnClass += "bg-indigo-600 text-white shadow-md shadow-indigo-200 transform scale-105 ring-2 ring-indigo-600 ring-offset-2";
                else if(isToday) btnClass += "bg-indigo-50 text-indigo-700 border border-indigo-200 hover:bg-indigo-100";
                else btnClass += "text-slate-600 hover:bg-slate-100 border border-transparent";
                
                let dot = hasEvents ? `<div class="w-1.5 h-1.5 rounded-full ${isSelected?'bg-white':'bg-rose-500'} mt-1 shadow-sm"></div>` : `<div class="w-1.5 h-1.5 mt-1"></div>`;
                
                daysContainer.innerHTML += `
                    <div class="p-0.5">
                        <button onclick="selectDate('${dateKey}')" class="${btnClass}">
                            ${i}
                            ${dot}
                        </button>
                    </div>
                `;
            }
            
            renderTasks();
        }

        function selectDate(dateKey) {
            selectedDate = dateKey;
            renderCalendar();
        }

        function renderTasks() {
            const taskContainer = document.getElementById('calendar-tasks');
            const dict = i18n[currentLang];
            const monthStr = String(currentMonth + 1).padStart(2, '0');
            
            let filteredEvents = [];
            let headerText = "";
            
            if(selectedDate) {
                filteredEvents = taxEvents.filter(e => e.date === selectedDate);
                headerText = currentLang === 'zh' ? `任务明细` : `Daily Tasks`;
            } else {
                filteredEvents = taxEvents.filter(e => e.date.startsWith(monthStr + "-"));
                headerText = currentLang === 'zh' ? `本月合规概览` : `Monthly Overview`;
            }
            
            let html = `
                <h4 class="text-xs font-black text-slate-400 uppercase tracking-wider mb-5 border-b border-slate-200/60 pb-3 flex items-center">
                    <i class="fa-solid fa-list-check mr-2"></i> ${headerText}
                </h4>
            `;
            
            if(filteredEvents.length === 0) {
                html += `<div class="flex flex-col items-center justify-center h-48 text-slate-400">
                    <div class="w-12 h-12 bg-slate-100 rounded-full flex items-center justify-center mb-3"><i class="fa-solid fa-mug-hot text-xl"></i></div>
                    <p class="text-sm font-medium">${selectedDate ? (currentLang==='zh'?'当天无合规任务':'No tasks for this day') : (currentLang==='zh'?'本月无重大合规节点':'No major deadlines this month')}</p>
                </div>`;
            } else {
                html += `<div class="space-y-4">`;
                filteredEvents.forEach(e => {
                    const desc = currentLang === 'zh' ? e.event_zh : e.event_en;
                    html += `
                        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex gap-4 hover:shadow-md transition-shadow">
                            <div class="flex-shrink-0 flex flex-col items-center justify-center w-14 h-14 bg-indigo-50 rounded-xl text-indigo-600 border border-indigo-100">
                                <span class="text-[10px] font-black uppercase">${dict.months[parseInt(e.date.split('-')[0])-1]}</span>
                                <span class="text-lg font-black leading-none mt-0.5">${parseInt(e.date.split('-')[1])}</span>
                            </div>
                            <div class="flex-1 flex flex-col justify-center">
                                <p class="font-bold text-slate-800 text-sm mb-2">${desc}</p>
                                <div class="flex flex-wrap gap-1.5">
                                    ${e.states.map(s => `<span class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded-md text-[10px] font-bold border border-slate-200">${s}</span>`).join('')}
                                </div>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            }
            
            if(!selectedDate) {
                html += `<div class="mt-8 text-xs text-slate-500 text-center bg-white p-3 rounded-xl border border-slate-200 shadow-sm"><i class="fa-solid fa-circle-info mr-1.5 text-indigo-400"></i> ${dict.taskTips}</div>`;
            }
            
            taskContainer.innerHTML = html;
        }

        window.onload = () => {
            applyTranslations();
            renderStateList();
        };
    </script>
</body>
</html>
