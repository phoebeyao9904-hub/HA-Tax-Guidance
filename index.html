<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US State Tax Lookup</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
        .custom-scrollbar:hover::-webkit-scrollbar-thumb { background-color: #94a3b8; }
        
        .animate-fade-in { animation: fadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="text-slate-800 antialiased h-screen flex flex-col overflow-hidden bg-slate-50">

    <header class="bg-slate-900 text-white shadow-lg z-20 relative">
        <div class="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <!-- 移动端菜单按钮 -->
                <button id="mobileMenuBtn" class="md:hidden text-slate-300 hover:text-white focus:outline-none transition-colors">
                    <i class="fa-solid fa-bars text-2xl"></i>
                </button>
                <div class="bg-indigo-500/20 p-2 rounded-lg hidden sm:block">
                    <i class="fa-solid fa-building-columns text-2xl text-indigo-400"></i>
                </div>
                <div>
                    <h1 id="ui-title" class="text-xl font-bold tracking-tight">美国州税检索表</h1>
                </div>
            </div>
            <div class="flex items-center space-x-3 md:space-x-4">
                
                <!-- 语言切换按钮 -->
                <button id="langToggleBtn" class="text-sm bg-slate-800 hover:bg-slate-700 text-white px-3 py-2 rounded-lg font-bold transition-colors flex items-center shadow-sm border border-slate-700">
                    <i class="fa-solid fa-language mr-1.5 text-indigo-400"></i> <span id="currentLangLabel">English</span>
                </button>

                <!-- 申报日历按钮 -->
                <button id="openCalendarBtn" class="text-sm bg-indigo-600 hover:bg-indigo-500 text-white px-3 md:px-4 py-2 rounded-lg font-medium transition-colors flex items-center shadow-sm">
                    <i class="fa-regular fa-calendar-days md:mr-2"></i> <span id="ui-btnCalendar" class="hidden md:inline">全美申报日历</span>
                </button>
                <div class="hidden lg:flex text-sm bg-slate-800/80 px-4 py-2 rounded-lg border border-slate-700 items-center text-slate-300" id="ui-pl86272">
                    <i class="fa-solid fa-shield-halved mr-2 text-emerald-400"></i>
                    <span><strong class="text-white">PL 86-272 保护：</strong>仅限于有形动产推销，受联邦法豁免企业所得税。</span>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-[1400px] w-full mx-auto md:px-6 lg:px-8 md:py-6 flex flex-col md:flex-row gap-6 overflow-hidden relative">
        
        <div id="sidebarOverlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-30 hidden transition-opacity md:hidden"></div>

        <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-[280px] sm:w-[320px] md:relative md:w-[320px] lg:w-[360px] transform -translate-x-full md:translate-x-0 transition duration-300 ease-in-out flex-shrink-0 flex flex-col h-full bg-white md:rounded-2xl shadow-2xl md:shadow-sm border-r md:border border-slate-200 overflow-hidden">
            <div class="p-5 border-b border-slate-100 bg-slate-50/50">
                <div class="flex justify-between items-center mb-3">
                    <h2 id="ui-selectState" class="text-base font-semibold text-slate-700 flex items-center">
                        <i class="fa-solid fa-location-dot text-indigo-500 mr-2"></i> 选择目标州
                    </h2>
                    <button id="closeSidebarBtn" class="md:hidden text-slate-400 hover:text-slate-600 focus:outline-none p-1">
                        <i class="fa-solid fa-xmark text-xl"></i>
                    </button>
                </div>
                <div class="relative">
                    <i class="fa-solid fa-search absolute left-3.5 top-3 text-slate-400"></i>
                    <input type="text" id="searchInput" placeholder="搜索州名或缩写 (如 WA)..." class="w-full bg-white border border-slate-200 text-slate-800 text-sm rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 block pl-10 p-2.5 transition-shadow shadow-sm">
                </div>
            </div>
            <div class="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-1" id="stateList">
                <!-- State list populated by JS -->
            </div>
        </aside>

        <section class="flex-1 h-full bg-white md:rounded-2xl shadow-sm md:border border-slate-200 overflow-hidden flex flex-col w-full relative z-10">
            
            <!-- Welcome Screen -->
            <div id="welcomeScreen" class="flex-1 flex flex-col items-center justify-center p-8 text-center h-full">
                <div class="w-24 h-24 bg-indigo-50 rounded-full flex items-center justify-center mb-6 shadow-inner">
                    <i class="fa-solid fa-map-location-dot text-4xl text-indigo-300"></i>
                </div>
                <h2 id="ui-welcomeTitle" class="text-2xl font-bold text-slate-700 mb-3">请选择目标州</h2>
                <p id="ui-welcomeDesc" class="text-slate-500 max-w-md leading-relaxed">
                    在左侧选择您产生业务的州，以查看针对 C-Corp 批发企业的详细税务合规要求。<br><br>
                    <span class="text-sm bg-slate-100 px-3 py-1 rounded-full text-slate-600 inline-block mt-2"><i class="fa-solid fa-lightbulb text-amber-500 mr-1"></i> 提示：优先关注有库存税、总收入税的州。</span>
                </p>
            </div>

            <div id="taxDisplayScreen" class="hidden flex-col h-full p-6 lg:p-8">
                <!-- State Header Info -->
                <div class="border-b border-slate-100 pb-5 mb-2">
                    <div class="flex items-center space-x-4 mb-3">
                        <div class="w-12 h-12 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold text-xl shadow-md" id="stateAbbr"></div>
                        <div>
                            <h2 class="text-2xl font-bold text-slate-800" id="stateTitle"></h2>
                        </div>
                    </div>
                    <div id="tagContainer" class="flex flex-wrap gap-2 mt-3"></div>
                    <p class="text-slate-600 text-sm mt-4 bg-slate-50 p-4 rounded-xl border border-slate-100 leading-relaxed" id="stateNote"></p>
                </div>

                <!-- Scrollable Cards Container -->
                <div class="flex-1 overflow-y-auto custom-scrollbar mt-2 pr-1 space-y-6 pb-6" id="taxCardsContainer">
                    <!-- Cards will be injected here -->
                </div>
            </div>

        </section>
    </main>

    <div id="calendarModal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm modal-overlay"></div>
        <div class="absolute inset-x-0 bottom-0 md:inset-auto md:top-1/2 md:left-1/2 md:-translate-x-1/2 md:-translate-y-1/2 bg-white w-full md:w-[850px] max-h-[90vh] md:h-[600px] rounded-t-3xl md:rounded-2xl shadow-2xl flex flex-col overflow-hidden transition-all">
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50 flex-shrink-0">
                <h2 id="ui-calHeader" class="text-xl font-bold text-slate-800 flex items-center">
                    <div class="w-8 h-8 rounded bg-indigo-100 text-indigo-600 flex items-center justify-center mr-3 shadow-sm">
                        <i class="fa-regular fa-calendar-check"></i>
                    </div>
                    全美 C-Corp 税务申报日历
                </h2>
                <button id="closeCalendarBtn" class="text-slate-400 hover:text-rose-500 transition-colors p-2 focus:outline-none">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            
            <div class="flex flex-col md:flex-row flex-1 overflow-hidden">
                <div class="w-full md:w-[55%] flex flex-col border-b md:border-b-0 md:border-r border-slate-100 p-5 bg-white overflow-y-auto">
                    <div class="flex justify-between items-center mb-6">
                        <button id="prevMonthBtn" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-600 transition-colors focus:outline-none">
                            <i class="fa-solid fa-chevron-left"></i>
                        </button>
                        <h3 id="currentMonthYear" class="text-lg font-bold text-slate-800"></h3>
                        <button id="nextMonthBtn" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-600 transition-colors focus:outline-none">
                            <i class="fa-solid fa-chevron-right"></i>
                        </button>
                    </div>
                    
                    <div id="ui-daysGrid" class="grid grid-cols-7 gap-1 text-center mb-2">
                        <!-- Days populated by JS -->
                    </div>
                    
                    <div id="calendarGrid" class="grid grid-cols-7 gap-1 text-center">
                        <!-- JS 注入日期 -->
                    </div>
                </div>
                
                <div class="w-full md:w-[45%] bg-slate-50/80 p-5 flex flex-col h-full overflow-y-auto custom-scrollbar">
                    <div class="flex items-center justify-between mb-4 pb-2 border-b border-slate-200">
                        <h4 id="selectedDateHeader" class="font-bold text-slate-700 text-lg">本月关键节点</h4>
                        <button id="resetMonthViewBtn" class="text-xs text-indigo-600 hover:text-indigo-800 hidden font-medium bg-indigo-50 px-2 py-1 rounded">查看全月</button>
                    </div>
                    <div id="dateDetailsContainer" class="space-y-4 flex-1">
                        <!-- JS 注入详情 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentLang = 'zh'; // Global language state

        const i18n = {
            zh: {
                title: "美国州税检索表",
                pl86272: `<i class="fa-solid fa-shield-halved mr-2 text-emerald-400"></i><span><strong class="text-white">联邦法 86-272 保护：</strong>仅限于有形动产推销，受联邦法豁免企业所得税。</span>`,
                btnCalendar: "全美申报日历",
                searchPlaceholder: "搜索州名或缩写 (如 WA)...",
                selectState: `<i class="fa-solid fa-location-dot text-indigo-500 mr-2"></i> 选择目标州`,
                welcomeTitle: "请选择目标州",
                welcomeDesc: "在左侧选择您产生业务的州，以查看针对 C-Corp 批发企业的详细税务合规要求。<br><br><span class='text-sm bg-slate-100 px-3 py-1 rounded-full text-slate-600 inline-block mt-2'><i class='fa-solid fa-lightbulb text-amber-500 mr-1'></i> 提示：优先关注有库存税、总收入税的州。</span>",
                nexusTitle: "纳税义务触发条件",
                rateTitle: "税率",
                calcTitle: "计算方法与实务",
                deadlineTitle: "申报时间",
                penaltyTitle: "晚交惩罚",
                certBtn: "获取表格: ",
                calHeader: "全美 C-Corp 税务申报日历",
                calSummary: "重要节点汇总",
                calReset: "查看全月",
                calEmpty: "本月无重大联邦/州级税务截止日。",
                calEmptySub: "注：常规按月申报的销售及工资税除外。",
                calDetail: "申报详情",
                days: ["日", "一", "二", "三", "四", "五", "六"],
                months: ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"]
            },
            en: {
                title: "US State Tax Lookup",
                pl86272: `<i class="fa-solid fa-shield-halved mr-2 text-emerald-400"></i><span><strong class="text-white">PL 86-272 Protection:</strong> Exempts C-Corps from net income tax if activity is strictly limited to soliciting sales of tangible goods.</span>`,
                btnCalendar: "Filing Calendar",
                searchPlaceholder: "Search state or abbreviation (e.g., WA)...",
                selectState: `<i class="fa-solid fa-location-dot text-indigo-500 mr-2"></i> Select State`,
                welcomeTitle: "Please Select a State",
                welcomeDesc: "Select a state from the left to view detailed tax compliance requirements for C-Corp wholesale businesses.<br><br><span class='text-sm bg-slate-100 px-3 py-1 rounded-full text-slate-600 inline-block mt-2'><i class='fa-solid fa-lightbulb text-amber-500 mr-1'></i> Tip: Pay close attention to states with Inventory Tax and Gross Receipts Tax.</span>",
                nexusTitle: "Nexus Threshold",
                rateTitle: "Tax Rate",
                calcTitle: "Calculation & Practice",
                deadlineTitle: "Filing Deadline",
                penaltyTitle: "Late Penalty",
                certBtn: "Get Form: ",
                calHeader: "National C-Corp Tax Calendar",
                calSummary: "Key Deadlines Summary",
                calReset: "View Full Month",
                calEmpty: "No major federal/state tax deadlines this month.",
                calEmptySub: "Note: Excludes regular monthly sales & payroll taxes.",
                calDetail: "Deadline Details",
                days: ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"],
                months: ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"]
            }
        };

        const formula = (text) => `<div class="bg-indigo-50/50 p-3 rounded-lg border border-indigo-100 my-2 font-mono text-sm text-indigo-800"><i class="fa-solid fa-calculator text-indigo-400 mr-2"></i>${text}</div>`;

        const cit = (rate, threshold_zh, threshold_en, calcFormula_zh, calcFormula_en, pl86272 = true, extraNote_zh = "", extraNote_en = "") => ({
            type_zh: "企业所得税", type_en: "Corporate Income Tax", icon: "fa-landmark text-emerald-600",
            nexus_zh: `<b>经济关联门槛：</b>年度本州总销售额达到或超过 <b>${threshold_zh}</b>。` + (pl86272 ? `<br><span class='text-emerald-700 text-xs mt-1.5 block font-medium'><i class="fa-solid fa-shield-halved"></i> 联邦法保护：受联邦法 86-272 保护，可免交此类税。</span>` : ""),
            nexus_en: `<b>Economic Nexus:</b> Annual gross sales into the state reach or exceed <b>${threshold_en}</b>.` + (pl86272 ? `<br><span class='text-emerald-700 text-xs mt-1.5 block font-medium'><i class="fa-solid fa-shield-halved"></i> Federal Protection: Protected by PL 86-272, exempt from this tax.</span>` : ""),
            rate: rate,
            calc_zh: formula(calcFormula_zh) + extraNote_zh,
            calc_en: formula(calcFormula_en) + extraNote_en,
            deadline_zh: "通常为财年结束后第4个月15日。", deadline_en: "Usually the 15th day of the 4th month after fiscal year end.",
            penalty_zh: "晚交及晚申报通常各按每月5%累计，最高25%。", penalty_en: "Usually 5% per month for late filing/payment, up to 25% max."
        });

        const getGenericSalesTax = (stateName_zh, stateName_en, salesThreshold, certName_zh = "多州通用转售证明", certName_en = "Multi-State Resale Cert (MTC)", certLink = "https://www.mtc.gov/wp-content/uploads/2023/01/Unif-Resale-Cert-revised-10-14-22.pdf") => ({
            type_zh: "销售及使用税", type_en: "Sales & Use Tax", icon: "fa-cash-register text-slate-400",
            nexus_zh: `<b>关联门槛：</b>年度本州总销售额达到或超过 <b>${salesThreshold}</b>。<br><span class='text-amber-600 text-xs mt-1.5 block font-medium'><i class="fa-solid fa-circle-info"></i> 注意：B2B免税批发额同样计入门槛。</span>`,
            nexus_en: `<b>Economic Nexus:</b> Annual gross sales reach or exceed <b>${salesThreshold}</b>.<br><span class='text-amber-600 text-xs mt-1.5 block font-medium'><i class="fa-solid fa-circle-info"></i> Note: B2B exempt wholesale amounts count towards this threshold.</span>`,
            rate: "州税 + 地方税",
            calc_zh: formula("应纳税额 = 应税销售总额 × 综合税率") + `<span class='font-semibold text-indigo-600 block mb-1 mt-2'>实务操作：</span>必须注册税号，收集 <b>${certName_zh}</b>，并按时进行零申报。`,
            calc_en: formula("Tax Due = Taxable Sales × Combined Rate") + `<span class='font-semibold text-indigo-600 block mb-1 mt-2'>Practice:</span> Must register, collect <b>${certName_en}</b>, and file zero returns.`,
            deadline_zh: "依州指派频率 (季报或年报)。", deadline_en: "Assigned frequency (Quarterly/Annually).",
            penalty_zh: "未零申报面临 $50-$100 晚申报罚金。", penalty_en: "$50-$100 penalty for missing zero returns.",
            cert_zh: { name: certName_zh, link: certLink }, cert_en: { name: certName_en, link: certLink }
        });

        const inventoryTax = (rate, calcText_zh, calcText_en, note_zh, note_en) => ({
            type_zh: "商业库存财产税", type_en: "Business Inventory Tax", icon: "fa-boxes-stacked text-purple-500",
            nexus_zh: "<b>关联门槛：</b>在本州拥有实物库存 (如海外仓、第三方代发仓、亚马逊 FBA)。<br><span class='text-purple-700 text-xs mt-1.5 block font-medium'><i class='fa-solid fa-triangle-exclamation'></i> 财产税性质，不受联邦法 86-272 保护！</span>",
            nexus_en: "<b>Nexus:</b> Owning physical inventory in the state (e.g. 3PL, FBA).<br><span class='text-purple-700 text-xs mt-1.5 block font-medium'><i class='fa-solid fa-triangle-exclamation'></i> Property tax nature, NOT protected by PL 86-272!</span>",
            rate: rate,
            calc_zh: formula(calcText_zh) + note_zh, calc_en: formula(calcText_en) + note_en,
            deadline_zh: "多为1月1日评估，3月至4月提交财产申报。", deadline_en: "Assessed Jan 1st, renditions typically due March-April.",
            penalty_zh: "未申报通常面临 10% 罚款。", penalty_en: "10% penalty on assessed value for failure to file."
        });

        const nomadSalesTax = () => ({
            type_zh: "销售及使用税", type_en: "Sales & Use Tax", icon: "fa-cash-register text-slate-400",
            nexus_zh: "无。本州免销售税。", nexus_en: "None. State does not impose sales tax.",
            rate: "0%",
            calc_zh: "无需注册销售税号，也无需收集免税证明。", calc_en: "No sales tax permit or resale certificates required.",
            deadline_zh: "-", deadline_en: "-", penalty_zh: "-", penalty_en: "-"
        });

        const stateNamesMap = {
            "AL": ["阿拉巴马", "Alabama"], "AK": ["阿拉斯加", "Alaska"], "AZ": ["亚利桑那", "Arizona"],
            "AR": ["阿肯色", "Arkansas"], "CA": ["加利福尼亚", "California"], "CO": ["科罗拉多", "Colorado"],
            "CT": ["康涅狄格", "Connecticut"], "DE": ["特拉华", "Delaware"], "FL": ["佛罗里达", "Florida"],
            "GA": ["佐治亚", "Georgia"], "HI": ["夏威夷", "Hawaii"], "ID": ["爱达荷", "Idaho"],
            "IL": ["伊利诺伊", "Illinois"], "IN": ["印第安纳", "Indiana"], "IA": ["爱荷华", "Iowa"],
            "KS": ["堪萨斯", "Kansas"], "KY": ["肯塔基", "Kentucky"], "LA": ["路易斯安那", "Louisiana"],
            "ME": ["缅因", "Maine"], "MD": ["马里兰", "Maryland"], "MA": ["马萨诸塞", "Massachusetts"],
            "MI": ["密歇根", "Michigan"], "MN": ["明尼苏达", "Minnesota"], "MS": ["密西西比", "Mississippi"],
            "MO": ["密苏里", "Missouri"], "MT": ["蒙大拿", "Montana"], "NE": ["内布拉斯加", "Nebraska"],
            "NV": ["内华达", "Nevada"], "NH": ["新罕布什尔", "New Hampshire"], "NJ": ["新泽西", "New Jersey"],
            "NM": ["新墨西哥", "New Mexico"], "NY": ["纽约", "New York"], "NC": ["北卡罗来纳", "North Carolina"],
            "ND": ["北达科他", "North Dakota"], "OH": ["俄亥俄", "Ohio"], "OK": ["俄克拉荷马", "Oklahoma"],
            "OR": ["俄勒冈", "Oregon"], "PA": ["宾夕法尼亚", "Pennsylvania"], "RI": ["罗德岛", "Rhode Island"],
            "SC": ["南卡罗来纳", "South Carolina"], "SD": ["南达科他", "South Dakota"], "TN": ["田纳西", "Tennessee"],
            "TX": ["德克萨斯", "Texas"], "UT": ["犹他", "Utah"], "VT": ["佛蒙特", "Vermont"],
            "VA": ["弗吉尼亚", "Virginia"], "WA": ["华盛顿州 (西海岸)", "Washington"], "WV": ["西弗吉尼亚", "West Virginia"],
            "WI": ["威斯康星", "Wisconsin"], "WY": ["怀俄明", "Wyoming"], "DC": ["华盛顿特区 (首都)", "Washington D.C."]
        };

        const taxDatabase = {};

        Object.keys(stateNamesMap).forEach(abbr => {
            taxDatabase[abbr] = {
                name_zh: stateNamesMap[abbr][0], name_en: stateNamesMap[abbr][1], abbr: abbr,
                note_zh: "标准分配州，跨州批发受联邦法 86-272 保护，建议按规定进行零申报或最低额度申报。",
                note_en: "Standard apportionment state. Wholesale is protected by PL 86-272. File zero or minimum tax returns.",
                tags_zh: ["标准企业所得税"], tags_en: ["Standard CIT"],
                taxes: [
                    cit("依州而异", "$100,000", "$100,000", "企业所得税 = [联邦应税收入] × 州分摊比 × 州税率", "CIT = [Federal Taxable Income] × Apportionment × Rate"),
                    getGenericSalesTax(stateNamesMap[abbr][0], stateNamesMap[abbr][1], "$100,000")
                ]
            };
        });

        // Specific overrides for Nomad states
        ["AK", "DE", "MT", "NH", "OR"].forEach(abbr => { taxDatabase[abbr].taxes[1] = nomadSalesTax(); });

        // Specific Overrides for core complex states

                    const btn = document.createElement('button');
                    const isSelected = selectedStateKey === key;
                    btn.className = `w-full text-left px-4 py-3 rounded-xl transition-all duration-200 border flex items-center justify-between group ${isSelected ? 'bg-indigo-50 border-indigo-200' : 'border-transparent hover:bg-indigo-50 hover:border-indigo-100'}`;
                    
                    let warningIcon = "";
                    if(data[`tags_${currentLang}`].some(t => t.includes("🚨") || t.includes("📦"))) {
                        warningIcon = `<i class="fa-solid fa-circle-exclamation text-rose-400 text-xs ml-2"></i>`;
                    }

                    const displayName = currentLang === 'zh' ? data.name_zh : data.name_en;

                    btn.innerHTML = `
                        <div class="flex items-center">
                            <span class="w-10 h-10 rounded-lg bg-slate-100 text-slate-600 font-bold flex items-center justify-center text-sm group-hover:bg-indigo-100 group-hover:text-indigo-700 transition-colors">${data.abbr}</span>
                            <div class="ml-3">
                                <span class="block font-medium text-slate-800 text-sm">${displayName} ${warningIcon}</span>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-right text-slate-300 group-hover:text-indigo-400 text-sm"></i>
                    `;
                    
                    btn.onclick = () => {
                        selectedStateKey = key;
                        renderStateList(searchInput.value); // Re-render to show selection
                        if (window.innerWidth < 768) toggleSidebar();
                        showStateData(key);
                    };
                    stateList.appendChild(btn);
                });
            }

            function showStateData(stateKey) {
                const data = taxDatabase[stateKey];
                const dict = i18n[currentLang];
                
                document.getElementById('stateAbbr').textContent = data.abbr;
                document.getElementById('stateTitle').textContent = currentLang === 'zh' ? data.name_zh : data.name_en;
                document.getElementById('stateNote').innerHTML = data[`note_${currentLang}`];
                
                document.getElementById('tagContainer').innerHTML = data[`tags_${currentLang}`].map(tag => {
                    let color = "bg-indigo-50 text-indigo-700 border-indigo-100";
                    if (tag.includes("无") || tag.includes("免") || tag.includes("No")) color = "bg-emerald-50 text-emerald-700 border-emerald-100";
                    if (tag.includes("🚨") || tag.includes("Min") || tag.includes("Gross")) color = "bg-rose-50 text-rose-700 border-rose-100";
                    if (tag.includes("📦") || tag.includes("Inventory")) color = "bg-purple-50 text-purple-700 border-purple-100";
                    return `<span class="px-3 py-1 rounded-full text-xs font-semibold border ${color}">${tag}</span>`;
                }).join('');

                taxCardsContainer.innerHTML = '';
                
                data.taxes.forEach((tax, index) => {
                    const card = document.createElement('div');
                    card.className = "bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden animate-fade-in";
                    card.style.animationDelay = `${index * 0.1}s`;

                    let certHtml = "";
                    const certData = tax[`cert_${currentLang}`];
                    if (certData) {
                        certHtml = `
                            <div class="mt-5 pt-4 border-t border-slate-100/60">
                                <a href="${certData.link}" target="_blank" class="inline-flex items-center text-sm bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-4 py-2.5 rounded-xl font-semibold transition-colors border border-indigo-100 shadow-sm">
                                    <i class="fa-solid fa-file-pdf mr-2"></i>
                                    ${dict.certBtn}${certData.name}
                                </a>
                            </div>
                        `;
                    }

                    card.innerHTML = `
                        <div class="bg-slate-50/80 border-b border-slate-100 px-6 py-4 flex items-center justify-between">
                            <h3 class="text-lg font-bold text-slate-800 flex items-center">
                                <div class="w-8 h-8 rounded bg-white flex items-center justify-center mr-3 shadow-sm border border-slate-200">
                                    <i class="fa-solid ${tax.icon}"></i>
                                </div>
                                ${tax[`type_${currentLang}`]}
                            </h3>
                        </div>
                        <div class="p-6">
                            <div class="grid grid-cols-1 lg:grid-cols-2 gap-x-8 gap-y-6">
                                <div class="col-span-1 lg:col-span-2 bg-slate-50 border border-slate-200/60 rounded-xl p-5">
                                    <h4 class="text-xs font-bold text-slate-600 uppercase tracking-wider mb-2 flex items-center">
                                        <i class="fa-solid fa-link mr-2"></i> ${dict.nexusTitle}
                                    </h4>
                                    <p class="text-slate-700 text-sm leading-relaxed">${tax[`nexus_${currentLang}`]}</p>
                                </div>
                                <div class="space-y-6">
                                    <div>
                                        <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 flex items-center">
                                            <i class="fa-solid fa-percent text-slate-400 mr-2"></i> ${dict.rateTitle}
                                        </h4>
                                        <p class="text-slate-800 font-medium text-sm bg-slate-100/50 inline-block px-3 py-1.5 rounded-lg border border-slate-200">${tax.rate}</p>
                                    </div>
                                    <div>
                                        <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 flex items-center">
                                            <i class="fa-solid fa-calculator text-slate-400 mr-2"></i> ${dict.calcTitle}
                                        </h4>
                                        <div class="text-slate-600 text-sm leading-relaxed">${tax[`calc_${currentLang}`]}</div>
                                        ${certHtml}
                                    </div>
                                </div>
                                <div class="space-y-6 lg:border-l border-slate-100 lg:pl-8">
                                    <div>
                                        <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 flex items-center">
                                            <i class="fa-regular fa-clock text-slate-400 mr-2"></i> ${dict.deadlineTitle}
                                        </h4>
                                        <p class="text-slate-700 text-sm bg-blue-50 text-blue-800 px-3 py-2 rounded-lg border border-blue-100">${tax[`deadline_${currentLang}`]}</p>
                                    </div>
                                    <div>
                                        <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 flex items-center">
                                            <i class="fa-solid fa-gavel text-slate-400 mr-2"></i> ${dict.penaltyTitle}
                                        </h4>
                                        <p class="text-slate-600 text-sm flex items-start">
                                            <i class="fa-solid fa-triangle-exclamation text-rose-400 mt-1 mr-2 text-xs"></i>
                                            ${tax[`penalty_${currentLang}`]}
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    taxCardsContainer.appendChild(card);
                });

                welcomeScreen.classList.add('hidden');
                taxDisplayScreen.classList.remove('hidden');
                taxDisplayScreen.classList.add('flex');
            }

            let currentDate = new Date();
            let displayMonth = currentDate.getMonth(); 
            let displayYear = currentDate.getFullYear();
            let selectedDateStr = null; 

            function initCalendar() {
                const monthStr = String(displayMonth + 1).padStart(2, '0');
                const hasEvents = Object.keys(calendarData).some(key => key.startsWith(monthStr));
                if (!hasEvents) displayMonth = 3; // Default to April
                renderCalendar();
            }

            function renderCalendar() {
                const dict = i18n[currentLang];
                const grid = document.getElementById('calendarGrid');
                grid.innerHTML = '';
                document.getElementById('currentMonthYear').textContent = `${dict.months[displayMonth]} ${displayYear}`;

                const firstDay = new Date(displayYear, displayMonth, 1).getDay();
                const daysInMonth = new Date(displayYear, displayMonth + 1, 0).getDate();
                const today = new Date();

                for (let i = 0; i < firstDay; i++) {
                    const emptyCell = document.createElement('div');
                    emptyCell.className = "p-2";
                    grid.appendChild(emptyCell);
                }

                const monthStr = String(displayMonth + 1).padStart(2, '0');
                let monthEvents = [];

                for (let i = 1; i <= daysInMonth; i++) {
                    const dayCell = document.createElement('div');
                    const dayStr = String(i).padStart(2, '0');
                    const dateKey = `${monthStr}-${dayStr}`;
                    
                    const events = calendarData[dateKey];
                    const hasEvents = events && events.length > 0;
                    if(hasEvents) monthEvents.push({ dateKey, day: i, events });

                    const isToday = i === today.getDate() && displayMonth === today.getMonth() && displayYear === today.getFullYear();
                    const isSelected = selectedDateStr === dateKey;

                    let classes = "relative flex flex-col items-center justify-center p-2 h-10 w-10 mx-auto rounded-full cursor-pointer transition-colors text-sm font-medium ";
                    
                    if (isSelected) {
                        classes += "bg-indigo-600 text-white shadow-md";
                    } else if (isToday) {
                        classes += "bg-indigo-50 text-indigo-700 border border-indigo-200";
                    } else if (hasEvents) {
                        classes += "hover:bg-slate-100 text-slate-800 font-bold";
                    } else {
                        classes += "hover:bg-slate-100 text-slate-600";
                    }

                    dayCell.className = classes;
                    dayCell.innerHTML = `<span>${i}</span>`;

                    if (hasEvents) {
                        const dotContainer = document.createElement('div');
                        dotContainer.className = "flex space-x-1 absolute bottom-1";
                        events.slice(0, 3).forEach(ev => {
                            const dot = document.createElement('div');
                            const colorClass = isSelected ? 'bg-white opacity-80' : themeColors[ev.color].dot;
                            dot.className = `w-1 h-1 md:w-1.5 md:h-1.5 rounded-full ${colorClass}`;
                            dotContainer.appendChild(dot);
                        });
                        dayCell.appendChild(dotContainer);
                    }

                    dayCell.onclick = () => {
                        if (hasEvents) {
                            selectedDateStr = dateKey;
                            renderCalendar();
                            renderDateDetails(dateKey);
                        }
                    };
                    grid.appendChild(dayCell);
                }

                if (!selectedDateStr || !selectedDateStr.startsWith(monthStr)) {
                    renderMonthDetails(monthEvents);
                }
            }

            function renderMonthDetails(monthEvents) {
                const dict = i18n[currentLang];
                const container = document.getElementById('dateDetailsContainer');
                document.getElementById('selectedDateHeader').textContent = `${dict.months[displayMonth]} ${dict.calSummary}`;
                document.getElementById('resetMonthViewBtn').classList.add('hidden');
                
                container.innerHTML = '';

                if (monthEvents.length === 0) {
                    container.innerHTML = `
                        <div class="h-full flex flex-col items-center justify-center text-slate-400 p-6 text-center">
                            <i class="fa-regular fa-calendar-xmark text-4xl mb-3 opacity-30"></i>
                            <p class="text-sm">${dict.calEmpty}</p>
                            <p class="text-xs mt-2 opacity-60">${dict.calEmptySub}</p>
                        </div>
                    `;
                    return;
                }

                monthEvents.forEach(item => {
                    const dayBlock = document.createElement('div');
                    dayBlock.className = "relative pl-4 border-l-2 border-indigo-200 mb-6 pb-2";
                    
                    let html = `<h5 class="font-bold text-indigo-700 mb-3 absolute -left-[5px] -top-1 bg-slate-50/80 py-1"><div class="w-2 h-2 rounded-full bg-indigo-500 inline-block mr-2 ring-4 ring-indigo-100"></div>${dict.months[displayMonth]} ${item.day}</h5><div class="mt-5 space-y-3">`;
                    
                    item.events.forEach(ev => { html += generateEventCard(ev); });
                    html += `</div>`;
                    dayBlock.innerHTML = html;
                    container.appendChild(dayBlock);
                });
            }

            function renderDateDetails(dateKey) {
                const dict = i18n[currentLang];
                const events = calendarData[dateKey];
                const container = document.getElementById('dateDetailsContainer');
                const [m, d] = dateKey.split('-');
                
                document.getElementById('selectedDateHeader').textContent = `${dict.months[parseInt(m)-1]} ${parseInt(d)} - ${dict.calDetail}`;
                document.getElementById('resetMonthViewBtn').classList.remove('hidden');
                
                container.innerHTML = '';
                events.forEach(ev => { container.innerHTML += generateEventCard(ev); });
            }

            function generateEventCard(ev) {
                const theme = themeColors[ev.color];
                const noteText = ev[`note_${currentLang}`];
                const noteHtml = noteText ? `<div class="mt-3 text-xs ${theme.note} p-2 rounded-lg border leading-relaxed"><i class="fa-solid fa-circle-exclamation mr-1.5"></i>${noteText}</div>` : '';
                return `
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 hover:shadow-md transition-shadow">
                        <div class="flex justify-between items-center mb-2">
                            <span class="inline-flex items-center text-xs font-bold px-2 py-1 rounded-md ${theme.badge}">
                                ${ev.state}
                            </span>
                            <span class="text-xs text-slate-400 font-medium flex items-center"><i class="fa-solid ${ev.icon} mr-1.5 opacity-70"></i>${ev[`type_${currentLang}`]}</span>
                        </div>
                        <h6 class="font-semibold text-slate-800 text-sm leading-snug">${ev[`title_${currentLang}`]}</h6>
                        ${noteHtml}
                    </div>
                `;
            }

            document.getElementById('prevMonthBtn').addEventListener('click', () => {
                displayMonth--;
                if (displayMonth < 0) { displayMonth = 11; displayYear--; }
                selectedDateStr = null; renderCalendar();
            });

            document.getElementById('nextMonthBtn').addEventListener('click', () => {
                displayMonth++;
                if (displayMonth > 11) { displayMonth = 0; displayYear++; }
                selectedDateStr = null; renderCalendar();
            });
            
            document.getElementById('resetMonthViewBtn').addEventListener('click', () => {
                selectedDateStr = null; renderCalendar();
            });

            function toggleCalendar() {
                const modal = document.getElementById('calendarModal');
                modal.classList.toggle('hidden');
                if (!modal.classList.contains('hidden')) initCalendar();
            }
            
            document.getElementById('openCalendarBtn').addEventListener('click', toggleCalendar);
            document.getElementById('closeCalendarBtn').addEventListener('click', toggleCalendar);
            document.querySelector('.modal-overlay').addEventListener('click', toggleCalendar);

            searchInput.addEventListener('input', (e) => renderStateList(e.target.value));

            // Initial setup
            updateUILanguage(); 
        });
    </script>
</body>
</html>
